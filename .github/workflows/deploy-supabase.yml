name: Deploy Supabase

# Dijalankan manual dari tab Actions → "Deploy Supabase" → Run workflow.
# Butuh tiga rahasia repo (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token akun (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   kata sandi database proyek
#   SUPABASE_PROJECT_REF   ID proyek, bagian depan <ref>.supabase.co
# seed.sql (akun demo) tidak pernah dikirim ke produksi.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cek = hanya tampilkan migrasi yang akan dijalankan; jalankan = terapkan"
        type: choice
        options: [cek, jalankan]
        default: cek
      functions:
        description: "Deploy Edge Functions juga"
        type: boolean
        default: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrasi & Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Periksa rahasia
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Rahasia untuk $v belum diisi di Settings → Secrets and variables → Actions"; exit 1; fi
          done
      - name: Hubungkan proyek
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrasi yang akan dijalankan
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Terapkan migrasi
        if: inputs.mode == 'jalankan'
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: inputs.mode == 'jalankan' && inputs.functions
        run: npx supabase functions deploy --project-ref "$PROJECT_REF" --use-api
